<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遷城射程預覽</title>
<style>
:root {
  --bg: #f1eee6;
  --panel: #fbfaf6;
  --ink: #26231f;
  --muted: #756e62;
  --line: #e0d9cb;
  --soft: #ece7dc;
  --map-bg: #e8e2d4;
  --map-grid: rgba(60, 50, 30, .08);
  --accent: #0f6e66;
  --accent-ink: #ffffff;
  --city: #6b6358;
  --reloc: #b25a0a;
  --danger: #b4231f;
  --ok: #2f7d32;
  --target: #5b4bc4;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181714; --panel: #211f1b; --ink: #ece7dc; --muted: #a39c8e;
    --line: #37332c; --soft: #2b2823; --map-bg: #1d1b18; --map-grid: rgba(255,255,255,.05);
    --accent: #3fb3a5; --accent-ink: #0d1614; --city: #b3aa9b;
    --reloc: #f0a24a; --danger: #f06b64; --ok: #7ccf7f; --target: #a99bff;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181714; --panel: #211f1b; --ink: #ece7dc; --muted: #a39c8e;
  --line: #37332c; --soft: #2b2823; --map-bg: #1d1b18; --map-grid: rgba(255,255,255,.05);
  --accent: #3fb3a5; --accent-ink: #0d1614; --city: #b3aa9b;
  --reloc: #f0a24a; --danger: #f06b64; --ok: #7ccf7f; --target: #a99bff;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Segoe UI", system-ui, sans-serif;
  padding-inline: 16px; padding-block: 16px;
}
html[lang="zh-Hans"] body { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif; }
html[lang="en"] body, html[lang="vi"] body { font-family: "Segoe UI", system-ui, -apple-system, "Noto Sans", sans-serif; }
.app { display: flex; gap: 16px; height: 100%; min-height: 0; }
#mapwrap {
  position: relative; flex: 1; min-width: 0; background: var(--map-bg);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#map.grab { cursor: grab; }
#map.panning { cursor: grabbing; }
#map.remove { cursor: pointer; }
aside {
  width: 380px; flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; min-height: 0;
}
.scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 16px 18px 18px; }
.head { display: flex; align-items: flex-start; gap: 10px; }
.head h1 { flex: 1; }
h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: .02em; text-wrap: balance; }
#lang {
  font: inherit; font-size: 12.5px; color: var(--ink); background: var(--soft); border: 1px solid var(--line);
  border-radius: 7px; padding: 3px 6px; cursor: pointer;
}
.sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
h2 {
  font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .08em;
  margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px;
}
h2 .count { font-weight: 400; letter-spacing: 0; font-variant-numeric: tabular-nums; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: var(--soft); border-radius: 9px; padding: 3px; }
.seg button {
  border: 0; background: transparent; font: inherit; font-size: 13px; padding: 6px 2px; border-radius: 7px;
  cursor: pointer; color: var(--ink); display: flex; justify-content: center; align-items: baseline; gap: 5px;
}
.seg button .k { font-size: 11px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: var(--shadow); font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); margin: 7px 2px 0; min-height: 18px; }

input[type=text] {
  width: 100%; font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font-variant-numeric: tabular-nums;
}
input[type=text]:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
button:focus-visible, select:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 1px; }
.inrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 13px;
  padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--soft); }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; border-radius: 6px; width: 28px; height: 28px; line-height: 1; }
.x:hover { background: var(--soft); color: var(--ink); }
.link { border: 0; background: none; padding: 0; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.link:hover { color: var(--ink); }
.note { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.err { color: var(--danger); }

.tlist { margin-top: 6px; }
.trow {
  display: grid; grid-template-columns: 22px 1fr auto 28px; gap: 6px; align-items: center;
  padding: 3px 4px 3px 6px; border-radius: 7px; font-variant-numeric: tabular-nums; cursor: pointer;
}
.trow:hover, .trow.hl { background: var(--soft); }
.trow .n { font-size: 11px; font-weight: 600; color: #fff; background: var(--target); border-radius: 50%; width: 19px; height: 19px; display: grid; place-items: center; }
.trow .c { font-size: 13px; }
.trow .c small { color: var(--muted); margin-left: 6px; font-size: 12px; }
.pill { font-size: 11.5px; padding: 0 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.in { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill.edge { background: color-mix(in srgb, var(--reloc) 15%, transparent); color: var(--reloc); }
.pill.out { background: color-mix(in srgb, var(--danger) 13%, transparent); color: var(--danger); }
.pill.city { background: color-mix(in srgb, var(--city) 16%, transparent); color: var(--city); }
.tfoot { display: flex; justify-content: space-between; margin-top: 6px; }

.sugg { display: grid; gap: 8px; }
.card {
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; background: var(--panel);
}
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.card .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card .ord { font-size: 12px; color: var(--muted); }
.card .xy { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .cov { margin-left: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.card .cov b { font-size: 15px; }
.card .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card .alts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.chip {
  border: 0; font: inherit; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--soft); color: var(--ink);
  cursor: pointer; font-variant-numeric: tabular-nums;
}
.chip:hover { background: color-mix(in srgb, var(--accent) 16%, var(--soft)); }
.empty { font-size: 12.5px; color: var(--muted); padding: 8px 2px; }

.spotinfo { margin-top: 8px; font-size: 13px; display: grid; gap: 3px; font-variant-numeric: tabular-nums; }
.spotinfo .big { font-size: 14px; }
.spotinfo .big b { font-size: 20px; }

details { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 600; letter-spacing: .04em; }
details ul { padding-left: 18px; margin: 6px 0 0; }
details li { margin-top: 3px; }

.overlay { position: absolute; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); font-size: 12px; }
#legend { left: 10px; bottom: 10px; padding: 8px 10px; display: grid; gap: 3px; }
#legend .lv { display: flex; gap: 2px; margin: 2px 0 4px; }
#legend .lv div { width: 20px; height: 12px; border-radius: 2px; font-size: 9px; text-align: center; line-height: 12px; color: rgba(0,0,0,.55); }
#legend .row { display: flex; align-items: center; gap: 6px; }
#coord { right: 10px; bottom: 10px; padding: 5px 9px; font-variant-numeric: tabular-nums; }
#coord:empty { display: none; }
#tip { pointer-events: none; padding: 8px 10px; max-width: 260px; display: none; line-height: 1.55; }
#tip b { font-size: 13px; }
#tip .m { color: var(--muted); }
#tip .act { color: var(--target); font-weight: 600; }
#tip .act.rm { color: var(--danger); }
#zoom { right: 10px; top: 10px; display: flex; flex-direction: column; overflow: hidden; }
#zoom button { border: 0; background: transparent; font: inherit; font-size: 17px; width: 34px; height: 32px; cursor: pointer; color: var(--ink); }
#zoom button + button { border-top: 1px solid var(--line); }
#zoom button:hover { background: var(--soft); }
#nodata { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }

#langdlg {
  border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px; width: min(340px, calc(100vw - 32px));
  background: var(--panel); color: var(--ink); box-shadow: var(--shadow);
}
#langdlg::backdrop { background: rgba(20, 16, 10, .45); }
#langdlg h2 { margin: 0 0 4px; font-size: 16px; color: var(--ink); letter-spacing: .02em; display: block; }
#langdlg p { margin: 0 0 14px; font-size: 12.5px; color: var(--muted); }
#langdlg .opts { display: grid; gap: 8px; }
#langdlg .opts button {
  font: inherit; font-size: 15px; text-align: left; padding: 10px 14px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); display: flex; justify-content: space-between; align-items: center;
}
#langdlg .opts button:hover { background: var(--soft); }
#langdlg .opts button.rec { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
#langdlg .opts button small { font-size: 11.5px; color: var(--accent); }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { flex-direction: column; height: auto; }
  #mapwrap { flex: none; height: 58vh; min-height: 320px; }
  aside { width: 100%; }
  .scroll { overflow: visible; }
  #legend { display: none; }
}
</style>
</head>
<body>
<div class="app">
<div id="mapwrap">
  <canvas id="map"></canvas>
  <div id="nodata" hidden data-i18n="noData"></div>
  <div id="legend" class="overlay">
    <div data-i18n="legendLv"></div>
    <div class="lv" id="lvscale"></div>
    <div class="row"><svg width="14" height="12" viewBox="0 0 14 12"><ellipse cx="7" cy="6" rx="6" ry="4.5" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg><span data-i18n="legendSpot"></span></div>
    <div class="row"><svg width="14" height="12" viewBox="0 0 14 12"><ellipse cx="7" cy="6" rx="6" ry="4.5" fill="none" stroke="var(--city)" stroke-dasharray="2 2"/></svg><span data-i18n="legendCity"></span></div>
  </div>
  <div id="coord" class="overlay"></div>
  <div id="zoom" class="overlay">
    <button id="zin" data-i18n-title="zoomIn">＋</button>
    <button id="zout" data-i18n-title="zoomOut">－</button>
    <button id="zfit" data-i18n-title="zoomFit" style="font-size:13px">⤢</button>
  </div>
  <div id="tip" class="overlay"></div>
</div>

<aside>
  <div class="scroll">
    <div class="head">
      <h1 data-i18n="title"></h1>
      <select id="lang" aria-label="Language">
        <option value="zh-Hant">繁體中文</option>
        <option value="zh-Hans">简体中文</option>
        <option value="en">English</option>
        <option value="vi">Tiếng Việt</option>
      </select>
    </div>
    <p class="sub" data-i18n="sub"></p>

    <div class="seg" role="toolbar">
      <button id="tool-target" data-tool="target"><span data-i18n="toolTarget"></span><span class="k">1</span></button>
      <button id="tool-spot" data-tool="spot"><span data-i18n="toolSpot"></span><span class="k">2</span></button>
      <button id="tool-pan" data-tool="pan"><span data-i18n="toolPan"></span><span class="k">3</span></button>
    </div>
    <div class="hint" id="toolhint"></div>

    <h2><span data-i18n="hTargets"></span> <span class="count" id="tcount"></span></h2>
    <div class="inrow">
      <input type="text" id="t-in" data-i18n-ph="phTargets" autocomplete="off">
      <button class="btn" id="t-add" data-i18n="add"></button>
    </div>
    <div class="note err" id="t-err" hidden></div>
    <div class="tlist" id="tlist"></div>
    <div class="tfoot" id="tfoot">
      <button class="link" id="t-clear" data-i18n="clearAll"></button>
      <button class="link" id="t-fit" data-i18n="showAll"></button>
    </div>

    <h2 data-i18n="hCity"></h2>
    <div class="inrow">
      <input type="text" id="city-in" data-i18n-ph="phCity" autocomplete="off">
      <button class="x" id="city-clear" data-i18n-title="clear">×</button>
    </div>
    <div class="note" data-i18n="cityNote"></div>

    <h2 data-i18n="hSugg"></h2>
    <div class="sugg" id="sugg"></div>

    <h2 data-i18n="hSpot"></h2>
    <div class="inrow">
      <input type="text" id="spot-in" autocomplete="off">
      <button class="x" id="spot-clear" data-i18n-title="clear">×</button>
    </div>
    <div class="spotinfo" id="spotinfo"></div>

    <details>
      <summary data-i18n="rulesTitle"></summary>
      <ul id="rules"></ul>
    </details>
    <p class="note" style="margin-top:14px" data-i18n="disclaimer"></p>
  </div>
</aside>
</div>

<dialog id="langdlg" aria-labelledby="langdlg-title">
  <h2 id="langdlg-title">選擇語言 · Language</h2>
  <p>选择语言 · Chọn ngôn ngữ</p>
  <div class="opts" id="langopts"></div>
</dialog>

const LANGS = Object.keys(I18N);
let LANG = 'zh-Hant';
function t(key, vars) {
  let s = I18N[LANG][key];
  if (s == null) s = I18N['zh-Hant'][key];
  if (vars && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  return s;
}
// 回傳 [語言, 是不是使用者自己指定的]。不是自己指定的（第一次打開）才跳語言視窗
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && LANGS.includes(q)) return [q, true];
  try { const v = localStorage.getItem('reloc-lang'); if (LANGS.includes(v)) return [v, true]; } catch (e) { /* 無法儲存就照瀏覽器語言 */ }
  return [guessLang(), false];
}
function guessLang() {
  for (const l of navigator.languages || [navigator.language || '']) {
    const s = String(l).toLowerCase();
    if (/^zh-(tw|hk|mo|hant)/.test(s)) return 'zh-Hant';
    if (s.startsWith('zh')) return 'zh-Hans';
    if (s.startsWith('vi')) return 'vi';
    if (s.startsWith('en')) return 'en';
  }
  return 'en';
}
function saveLang(l) {
  try { localStorage.setItem('reloc-lang', l); } catch (e) { /* 只是這次有效 */ }
}
function askLang(rec) {
  const dlg = $('langdlg');
  if (!dlg.showModal) return;          // 很舊的瀏覽器沒有 <dialog>，就直接用猜的語言
  const box = $('langopts');
  box.innerHTML = '';
  for (const o of $('lang').options) {
    const b = document.createElement('button');
    b.lang = o.value;
    b.className = o.value === rec ? 'rec' : '';
    b.innerHTML = `<span>${esc(o.textContent)}</span>` + (o.value === rec ? `<small>${esc(I18N[o.value].recLabel)}</small>` : '');
    b.addEventListener('click', () => { saveLang(o.value); applyLang(o.value); dlg.close(); });
    box.appendChild(b);
  }
  // 按 Esc 或點外面關掉，就當作接受預選的語言，下次不再問
  dlg.addEventListener('close', () => saveLang(LANG), { once: true });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  dlg.showModal();
  const first = box.querySelector('.rec');
  if (first) first.focus();
}
function applyLang(l) {
  LANG = l;
  document.documentElement.lang = l;
  document.title = t('title');
  $('lang').value = l;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); el.setAttribute('aria-label', el.title); });
  canvas.setAttribute('aria-label', t('title'));
  $('rules').innerHTML = t('rules').map(r => `<li>${esc(r)}</li>`).join('');
  $('toolhint').textContent = t(TOOL_HINT[S.tool]);
  if (S.res) { renderSide(); draw(); }
}

// ---------------------------------------------------------------- 常數
const AREA = 6;                        // 一個大格是 6x6 邏輯格
const LV_COLORS = ['#e2ebd1', '#cde0b1', '#b2cf8f', '#e7d487', '#e2b763', '#d8914e', '#c76c40', '#a64c36', '#7e3429'];
const TOOL_HINT = { target: 'hintTarget', spot: 'hintSpot', pan: 'hintPan' };
const STORE_KEY = 'reloc-preview-v1';

// ---------------------------------------------------------------- 狀態
const S = {
  W: 0, H: 0, res: null, ok: null, grid: {}, landmarks: [], R: 60, slack: 3,
  view: { cx: 1200, cy: 1200, scale: 0.3 },
  tool: 'target',
  targets: [], city: null, spot: null, spotAuto: true,
  hover: null, hoverTarget: -1, hoverHit: -1,
  result: null, pick: 0,
  overview: null,
};
const $ = (id) => document.getElementById(id);
const canvas = $('map');
const ctx = canvas.getContext('2d');
let CSSV = {};
function readCssVars() {
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['map-bg', 'map-grid', 'ink', 'muted', 'panel', 'accent', 'city', 'reloc', 'danger', 'ok', 'target'])
    CSSV[k] = cs.getPropertyValue('--' + k).trim();
}

// ---------------------------------------------------------------- 座標與規則
function logicToArea(lx, ly) {
  const ax = Math.floor(lx / AREA);
  const ay = (ax & 1) === 0 ? Math.floor(ly / AREA) : Math.floor((ly + AREA / 2) / AREA);
  return [ax, ay];
}
function areaOrigin(ax, ay) { return [ax * AREA, ay * AREA - ((ax & 1) ? AREA / 2 : 0)]; }
function areaCenter(ax, ay) { const [x, y] = areaOrigin(ax, ay); return [x + 2, y + 2]; }
function inMap(ax, ay) { return ax >= 0 && ay >= 0 && ax < S.W && ay < S.H; }
function resAt(ax, ay) { return inMap(ax, ay) ? S.res[ay * S.W + ax] : 0; }
function canLand(ax, ay) {
  if (!inMap(ax, ay)) return false;
  const i = ay * S.W + ax;
  return (S.ok[i >> 3] >> (i & 7)) & 1;
}
function gd(a, b) { return Math.ceil(Math.hypot(a[0] - b[0], a[1] - b[1])); }   // 同遊戲，無條件進位
function reach() { return S.R - S.slack; }
// 目標相對某個主城位置的狀態：穩 / 看落點 / 打不到
function status(c, p) {
  if (!c) return null;
  const d = gd(c, p);
  return d <= reach() ? 'in' : d <= S.R ? 'edge' : 'out';
}
function fmt(p) { return p ? p[0] + ',' + p[1] : ''; }
function parseXY(s) {
  const m = String(s).trim().match(/^\(?\s*(\d+)\s*[,，\s]\s*(\d+)\s*\)?$/);
  return m ? [parseInt(m[1], 10), parseInt(m[2], 10)] : null;
}
function parseMany(s) {         // 「(140,936) (155,925)」「140,936；155,925」都吃
  const out = [];
  const re = /(\d+)\s*[,，]\s*(\d+)/g;
  let m;
  while ((m = re.exec(s))) out.push([parseInt(m[1], 10), parseInt(m[2], 10)]);
  if (!out.length) { const one = parseXY(s); if (one) out.push(one); }
  return out;
}
function areaInfo(p) {
  const [ax, ay] = logicToArea(p[0], p[1]);
  const id = resAt(ax, ay);
  const cfg = id ? S.grid[id] : null;
  return { ax, ay, cfg, land: !!canLand(ax, ay) };
}
function lvColor(lv) { return LV_COLORS[Math.max(0, Math.min(8, (lv || 1) - 1))]; }
function list(idx) { return idx.map(i => i + 1).join(t('sep')); }

// ---------------------------------------------------------------- 找遷城點
// 對一組目標，把射程內所有能落城的大格都算一次：罩住幾個、離圓邊最緊的那個還剩幾格。
// 罩得多的優先，一樣多時挑最有餘裕的（落點偏個兩三格也不會掉出射程）。
function rankAreas(targets) {
  const R = reach();
  const span = Math.ceil(R / AREA) + 1;
  const seen = new Set();
  const rows = [];
  for (const p of targets) {
    const [tax, tay] = logicToArea(p[0], p[1]);
    for (let ax = tax - span; ax <= tax + span; ax++) {
      for (let ay = tay - span; ay <= tay + span; ay++) {
        const k = ay * S.W + ax;
        if (seen.has(k) || !canLand(ax, ay)) continue;
        seen.add(k);
        const c = areaCenter(ax, ay);
        let n = 0, worst = 0, sum = 0;
        const cov = [];
        targets.forEach((q, i) => {
          const d = gd(c, q);
          if (d <= R) { n++; cov.push(i); worst = Math.max(worst, d); sum += d; }
        });
        if (n) rows.push({ area: [ax, ay], center: c, n, cov, margin: R - worst, sum });
      }
    }
  }
  rows.sort((a, b) => b.n - a.n || b.margin - a.margin || a.sum - b.sum);
  return rows;
}

// 一個圓罩不住全部時，照「先罩最多」一次一次排下去（貪婪法，目標數量不多時很接近最少次數）
function suggest() {
  const all = S.targets.map((p, i) => ({ p, i }));
  const already = S.city ? all.filter(o => gd(S.city, o.p) <= S.R).map(o => o.i) : [];
  let left = all.filter(o => !already.includes(o.i));
  const groups = [], unreachable = [];
  while (left.length && groups.length < 12) {
    const rows = rankAreas(left.map(o => o.p));
    if (!rows.length) { unreachable.push(...left.map(o => o.i)); break; }
    const best = rows[0];
    const cov = best.cov.map(k => left[k].i);
    // 備選：罩住一樣多的其他大格。首選被山賊或別人的主城佔住時依序換
    const alts = rows.slice(1).filter(r => r.n === best.n).slice(0, 5);
    groups.push({ ...best, cov, alts });
    const covSet = new Set(cov);
    left = left.filter(o => !covSet.has(o.i));
  }
  S.result = { groups, already, unreachable };
  if (S.pick >= groups.length) S.pick = 0;
  if (S.spotAuto) S.spot = groups.length ? groups[S.pick].center : null;
}

// ---------------------------------------------------------------- 狀態保存（只存在這台瀏覽器）
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      targets: S.targets, city: S.city, spot: S.spotAuto ? null : S.spot,
    }));
  } catch (e) { /* 私密視窗或封鎖儲存，下次重開就是空的 */ }
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (!d) return;
    // 第一版會預先放範例目標，那些不是使用者標的，不要帶過來
    S.targets = d.example ? [] : (d.targets || []).filter(p => Array.isArray(p) && p.length === 2);
    S.city = d.city || null;
    if (d.spot) { S.spot = d.spot; S.spotAuto = false; }
  } catch (e) { /* 讀不到就從空的開始 */ }
}

// ---------------------------------------------------------------- 更新
function changed() {
  suggest();
  save();
  renderSide();
  draw();
}
function addTargets(items) {
  for (const p of items)
    if (!S.targets.some(q => q[0] === p[0] && q[1] === p[1])) S.targets.push(p);
  changed();
}
function removeTarget(i) {
  S.targets.splice(i, 1);
  S.hoverTarget = -1; S.hoverHit = -1;
  changed();
}
function setSpot(p, auto) {
  S.spotAuto = !!auto;
  if (auto) suggest(); else S.spot = p;
  save();
  renderSide();
  draw();
}
function pickGroup(k, center) {
  S.pick = k;
  S.spotAuto = !center;
  S.spot = center || S.result.groups[k].center;
  save();
  renderSide();
  centerOnCircle(S.spot);
}

// ---------------------------------------------------------------- 側欄
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function tileText(p) {
  const a = areaInfo(p);
  if (!a.cfg) return t('emptyTile');
  return `Lv${a.cfg[0]} ${t('res')[a.cfg[1]] || ''}`;
}
function note(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  return d;
}

function renderSide() {
  // ---- 目標清單
  $('tcount').textContent = S.targets.length ? t('count', { n: S.targets.length }) : '';
  $('tfoot').hidden = !S.targets.length;
  const box = $('tlist');
  box.innerHTML = '';
  if (!S.targets.length) box.appendChild(note('empty', t('emptyTargets')));
  S.targets.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'trow' + (i === S.hoverTarget ? ' hl' : '');
    const inCity = S.city && gd(S.city, p) <= S.R;
    const st = status(S.spot, p);
    let pill = '';
    if (st) pill = `<span class="pill ${st}" title="${esc(t('distToSpot', { d: gd(S.spot, p) }))}">${esc(t('st_' + st))} · ${gd(S.spot, p)}</span>`;
    else if (inCity) pill = `<span class="pill city">${esc(t('inCityNow'))}</span>`;
    row.innerHTML = `<span class="n">${i + 1}</span>` +
      `<span class="c">${fmt(p)}<small>${esc(tileText(p))}</small></span>${pill}` +
      `<button class="x" title="${esc(t('remove'))}" aria-label="${esc(t('remove'))} ${i + 1}">×</button>`;
    row.addEventListener('mouseenter', () => { S.hoverTarget = i; draw(); });
    row.addEventListener('mouseleave', () => { S.hoverTarget = -1; draw(); });
    row.addEventListener('click', (e) => {
      if (e.target.closest('.x')) { removeTarget(i); return; }
      centerOn(p[0] + 0.5, p[1] + 0.5, Math.max(S.view.scale, 3));
    });
    box.appendChild(row);
  });

  // ---- 建議
  const sg = $('sugg');
  sg.innerHTML = '';
  const r = S.result;
  if (!S.targets.length) {
    sg.appendChild(note('empty', t('emptySugg')));
  } else if (r) {
    if (r.already.length) sg.appendChild(note('empty', t('already', { list: list(r.already) })));
    if (!r.groups.length && !r.unreachable.length) sg.appendChild(note('empty', t('allInRange')));
    const total = S.targets.length - r.already.length;
    r.groups.forEach((g, k) => {
      const c = document.createElement('div');
      c.className = 'card' + (S.spot && S.spot[0] === g.center[0] && S.spot[1] === g.center[1] ? ' on' : '');
      const ord = r.groups.length > 1 ? t('ordN', { k: k + 1 }) : t('ordBest');
      c.innerHTML =
        `<div class="top"><span class="ord">${esc(ord)}</span><span class="xy">${fmt(g.center)}</span>` +
        `<button class="chip copy" title="${esc(t('copyTitle'))}">${esc(t('copy'))}</button>` +
        `<span class="cov">${k === 0 ? t('covTotal', { n: g.cov.length, total }) : t('cov', { n: g.cov.length })}</span></div>` +
        `<div class="meta">${esc(t('meta', { list: list(g.cov), m: g.margin + S.slack, tile: tileText(g.center) }))}</div>`;
      if (g.alts.length) {
        const al = document.createElement('div');
        al.className = 'alts';
        al.innerHTML = `<span>${esc(t('alts'))}</span>`;
        for (const a of g.alts) {
          const b = document.createElement('button');
          b.className = 'chip';
          b.textContent = fmt(a.center);
          b.title = t('altTitle', { n: a.n, m: a.margin + S.slack });
          b.addEventListener('click', (e) => { e.stopPropagation(); pickGroup(k, a.center); });
          al.appendChild(b);
        }
        c.appendChild(al);
      }
      c.querySelector('.copy').addEventListener('click', (e) => { e.stopPropagation(); copyText(fmt(g.center), e.target); });
      c.addEventListener('click', () => pickGroup(k, null));
      sg.appendChild(c);
    });
    if (r.unreachable.length) sg.appendChild(note('empty err', t('unreachable', { list: list(r.unreachable), r: reach() })));
  }

  // ---- 試落點
  $('spot-in').value = S.spotAuto ? '' : fmt(S.spot);
  $('spot-in').placeholder = S.spotAuto && S.spot ? t('phSpotAuto', { xy: fmt(S.spot) }) : t('phSpot');
  $('city-in').value = fmt(S.city);
  const si = $('spotinfo');
  si.innerHTML = '';
  if (!S.spot) return;
  const a = areaInfo(S.spot);
  const cnt = { in: 0, edge: 0, out: 0 };
  for (const p of S.targets) cnt[status(S.spot, p)]++;
  if (S.targets.length) {
    const d = document.createElement('div');
    d.className = 'big';
    d.innerHTML = t('spotCounts', { a: cnt.in, b: cnt.edge, c: cnt.out });
    si.appendChild(d);
  }
  si.appendChild(note('', `${fmt(S.spot)} · ${tileText(S.spot)}`));
  si.appendChild(a.land ? note('note', t('canLand')) : note('note err', a.cfg ? t('noLandLm') : t('noLandRes')));
}

async function copyText(s, btn) {
  try { await navigator.clipboard.writeText(s); btn.textContent = t('copied'); }
  catch (e) { btn.textContent = s; }
  setTimeout(() => { btn.textContent = t('copy'); }, 1400);
}

// ---------------------------------------------------------------- 視角
const ISO_K = 0.66;                    // 跟遊戲同方向：x 往右上、y 往左上，垂直方向因俯角壓扁
function cw() { return canvas.clientWidth; }
function ch() { return canvas.clientHeight; }
function dpr() { return window.devicePixelRatio || 1; }
function toScreen(lx, ly) {
  const v = S.view, dx = lx - v.cx, dy = ly - v.cy;
  return [cw() / 2 + (dx - dy) * v.scale, ch() / 2 - (dx + dy) * v.scale * ISO_K];
}
function screenDeltaToLogic(dxs, dys) {
  const s = S.view.scale, a = dxs / s, b = -dys / (s * ISO_K);
  return [(a + b) / 2, (b - a) / 2];
}
function toLogic(sx, sy) {
  const [dx, dy] = screenDeltaToLogic(sx - cw() / 2, sy - ch() / 2);
  return [S.view.cx + dx, S.view.cy + dy];
}
function applyIso() {
  const v = S.view, s = v.scale, r = dpr();
  const ex = cw() / 2 - (v.cx - v.cy) * s, ey = ch() / 2 + (v.cx + v.cy) * s * ISO_K;
  ctx.setTransform(r * s, -r * s * ISO_K, -r * s, -r * s * ISO_K, r * ex, r * ey);
}
function resetT() { const r = dpr(); ctx.setTransform(r, 0, 0, r, 0, 0); }
function centerOn(lx, ly, scale) {
  S.view.cx = lx; S.view.cy = ly;
  if (scale) S.view.scale = scale;
  draw();
}
function zoomAt(sx, sy, factor) {
  const [lx, ly] = toLogic(sx, sy);
  S.view.scale = Math.max(0.12, Math.min(40, S.view.scale * factor));
  const [dx, dy] = screenDeltaToLogic(sx - cw() / 2, sy - ch() / 2);
  S.view.cx = lx - dx; S.view.cy = ly - dy;
  draw();
}
function fitPoints(pts, pad) {
  let u0 = Infinity, u1 = -Infinity, w0 = Infinity, w1 = -Infinity;
  for (const [x, y] of pts) {
    u0 = Math.min(u0, x - y); u1 = Math.max(u1, x - y);
    w0 = Math.min(w0, x + y); w1 = Math.max(w1, x + y);
  }
  u0 -= pad; u1 += pad; w0 -= pad; w1 += pad;
  const uc = (u0 + u1) / 2, wc = (w0 + w1) / 2;
  S.view.cx = (uc + wc) / 2; S.view.cy = (wc - uc) / 2;
  S.view.scale = Math.max(0.12, Math.min(40, 0.95 * Math.min(cw() / (u1 - u0), ch() / ((w1 - w0) * ISO_K))));
  draw();
}
function circleBox(c) { return [[c[0] - S.R, c[1] - S.R], [c[0] + S.R, c[1] + S.R], [c[0] - S.R, c[1] + S.R], [c[0] + S.R, c[1] - S.R]]; }
function fitView() {
  const pts = [...S.targets];
  if (S.spot) pts.push(...circleBox(S.spot));
  if (S.city) pts.push(...circleBox(S.city));
  if (S.result) for (const g of S.result.groups) pts.push(...circleBox(g.center));
  if (!pts.length) { const X = S.W * AREA, Y = S.H * AREA; fitPoints([[0, 0], [X, 0], [0, Y], [X, Y]], 0); return; }
  fitPoints(pts, 12);
}
function centerOnCircle(c) { fitPoints(circleBox(c), 8); }

// ---------------------------------------------------------------- 繪圖
function resize() {
  canvas.width = Math.round(cw() * dpr());
  canvas.height = Math.round(ch() * dpr());
  resetT();
  draw();
}

function buildOverview() {
  // 每個大格畫成 1x2 像素（奇數欄往上位移 1 像素 = 半格），縮小時直接貼這張
  if (S.overview) return;
  const c = document.createElement('canvas');
  c.width = S.W; c.height = S.H * 2 + 1;
  const g = c.getContext('2d');
  const img = g.createImageData(c.width, c.height);
  const rgb = LV_COLORS.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  for (let ay = 0; ay < S.H; ay++) {
    for (let ax = 0; ax < S.W; ax++) {
      const id = S.res[ay * S.W + ax];
      if (!id) continue;
      const cfg = S.grid[id];
      const col = rgb[Math.max(0, Math.min(8, (cfg ? cfg[0] : 1) - 1))];
      const y0 = ay * 2 + 1 - (ax & 1);
      for (let dy = 0; dy < 2; dy++) {
        const i = ((y0 + dy) * c.width + ax) * 4;
        img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = 255;
      }
    }
  }
  g.putImageData(img, 0, 0);
  S.overview = c;
}

function hexA(color, a) {
  if (color.startsWith('#') && color.length === 7) {
    const r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  return color;
}
function haloText(s, x, y, color) {
  ctx.lineWidth = 3; ctx.strokeStyle = CSSV.panel; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

// 滑鼠停在「試落點」時跟著游標跑的預覽圓
function hoverCell() { return S.hover ? [Math.floor(S.hover[0]), Math.floor(S.hover[1])] : null; }
function ghostCenter() { return S.tool === 'spot' ? hoverCell() : null; }
function sameSpot(c) { return S.spot && c[0] === S.spot[0] && c[1] === S.spot[1]; }

function draw() {
  if (!S.res) return;
  const W = cw(), H = ch(), sc = S.view.scale;
  ctx.fillStyle = CSSV['map-bg'];
  ctx.fillRect(0, 0, W, H);
  const gh = ghostCenter();
  const focus = gh || S.spot;

  const corners = [toLogic(0, 0), toLogic(W, 0), toLogic(0, H), toLogic(W, H)];
  const lx0 = Math.min(...corners.map(c => c[0])), lx1 = Math.max(...corners.map(c => c[0]));
  const ly0 = Math.min(...corners.map(c => c[1])), ly1 = Math.max(...corners.map(c => c[1]));

  // ---- 資源點。有預覽圓時，圈外的壓淡，一眼看出遷過去打得到哪些地
  if (sc < 2.2) {
    buildOverview();
    applyIso();
    ctx.transform(AREA, 0, 0, AREA / 2, 0, -AREA / 2);
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = focus ? 0.45 : 0.8;
    ctx.drawImage(S.overview, 0, 0);
    if (focus) {                       // 圈內再貼一次原色
      resetT(); applyIso();
      ctx.save();
      ctx.beginPath(); ctx.arc(focus[0] + 0.5, focus[1] + 0.5, S.R, 0, Math.PI * 2); ctx.clip();
      ctx.transform(AREA, 0, 0, AREA / 2, 0, -AREA / 2);
      ctx.globalAlpha = 1;
      ctx.drawImage(S.overview, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    resetT();
  } else {
    const ax0 = Math.max(0, Math.floor(lx0 / AREA) - 1), ax1 = Math.min(S.W - 1, Math.ceil(lx1 / AREA) + 1);
    const ay0 = Math.max(0, Math.floor(ly0 / AREA) - 1), ay1 = Math.min(S.H - 1, Math.ceil(ly1 / AREA) + 1);
    const g = sc >= 4 ? 0.7 / sc : 0;
    const labels = [];
    const rc = t('resChar');
    applyIso();
    for (let ax = ax0; ax <= ax1; ax++) {
      for (let ay = ay0; ay <= ay1; ay++) {
        const [x0, y0] = areaOrigin(ax, ay);
        const id = S.res[ay * S.W + ax];
        if (!id) {
          if (sc >= 5) { ctx.strokeStyle = CSSV['map-grid']; ctx.lineWidth = 1 / sc; ctx.strokeRect(x0, y0, AREA, AREA); }
          continue;
        }
        const cfg = S.grid[id];
        const lv = cfg ? cfg[0] : 1;
        const inside = !focus || gd(focus, [x0 + 2.5, y0 + 2.5]) <= S.R;
        ctx.globalAlpha = inside ? (focus ? 1 : 0.85) : 0.3;
        ctx.fillStyle = lvColor(lv);
        ctx.fillRect(x0 + g, y0 + g, AREA - 2 * g, AREA - 2 * g);
        if (sc >= 6 && cfg) labels.push([x0 + AREA / 2, y0 + AREA / 2, cfg, lv, ctx.globalAlpha]);
      }
    }
    ctx.globalAlpha = 1;
    resetT();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const [cx, cy, cfg, lv, a] of labels) {
      const [sx, sy] = toScreen(cx, cy);
      ctx.globalAlpha = Math.max(a, 0.5);
      ctx.fillStyle = 'rgba(40,30,20,.6)';
      ctx.font = `${Math.min(15, sc * 1.8)}px system-ui, sans-serif`;
      ctx.fillText(rc[cfg[1]] || '', sx, sy - (sc >= 9 ? 7 : 0));
      if (sc >= 9) { ctx.font = `${Math.min(12, sc * 1.2)}px sans-serif`; ctx.fillText('Lv' + lv, sx, sy + 8); }
    }
    ctx.globalAlpha = 1;
  }

  // ---- 地標
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const [x, y, type, level, dock, born] of S.landmarks) {
    if (x < lx0 - 20 || x > lx1 + 20 || y < ly0 - 20 || y > ly1 + 20) continue;
    const [sx, sy] = toScreen(x + 0.5, y + 0.5);
    const r = dock ? Math.max(3.5, Math.min(8, sc * 1.4)) : Math.max(2.5, Math.min(7, sc * 1.1));
    ctx.beginPath();
    ctx.moveTo(sx, sy - r); ctx.lineTo(sx + r, sy); ctx.lineTo(sx, sy + r); ctx.lineTo(sx - r, sy); ctx.closePath();
    ctx.fillStyle = dock ? '#2563eb' : (born ? '#9f1239' : '#57534e');
    ctx.fill();
    ctx.strokeStyle = CSSV.panel; ctx.lineWidth = 1.2; ctx.stroke();
    if (sc >= 1.2 && (dock || sc >= 2.5)) {
      ctx.font = '11px system-ui, sans-serif';
      haloText(dock ? t('wharf') : (born ? t('born') : t('landmark', { lv: level || '?' })), sx, sy + r + 2, dock ? '#1e40af' : CSSV.ink);
    }
  }

  // ---- 射程圈：目前主城（虛線）、其他遷城建議（淡）、正在看的落點（實線）
  if (S.city) circle(S.city, CSSV.city, { dash: [5, 4], fill: 0.04, width: 1.4 });
  if (S.result) S.result.groups.forEach(g => {
    if (!sameSpot(g.center)) circle(g.center, CSSV.accent, { dash: [3, 5], fill: 0, width: 1.1, alpha: 0.5 });
  });
  if (S.spot) circle(S.spot, CSSV.accent, { fill: gh ? 0.03 : 0.08, width: 2, inner: true });
  if (gh) circle(gh, CSSV.reloc, { fill: 0.07, width: 2, inner: true });

  // ---- 主城標記
  const multi = S.result && S.result.groups.length > 1;
  if (S.city) drawCity(S.city, CSSV.city, t('mCity'));
  if (S.result) S.result.groups.forEach((g, k) => {
    if (!sameSpot(g.center)) drawCity(g.center, hexA(CSSV.accent, 0.55), multi ? t('mNth', { k: k + 1 }) : t('mSugg'));
  });
  if (S.spot) {
    const k = S.result ? S.result.groups.findIndex(g => sameSpot(g.center)) : -1;
    drawCity(S.spot, CSSV.accent, k >= 0 ? (multi ? t('mNthReloc', { k: k + 1 }) : t('mBest')) : t('mSpot'));
  }
  if (gh) drawCity(gh, CSSV.reloc, t('mGhost', { xy: fmt(gh) }));

  // ---- 滑鼠所在的大格與那一格
  const hc = hoverCell();
  if (hc && sc >= 1.5) {
    const [ax, ay] = logicToArea(hc[0], hc[1]);
    const [x0, y0] = areaOrigin(ax, ay);
    applyIso(); ctx.beginPath(); ctx.rect(x0, y0, AREA, AREA); resetT();
    ctx.strokeStyle = hexA(CSSV.ink.startsWith('#') ? CSSV.ink : '#26231f', 0.55); ctx.lineWidth = 1; ctx.setLineDash([]); ctx.stroke();
  }

  // ---- 目標
  S.targets.forEach((p, i) => {
    const st = status(focus, p);
    const color = st === 'in' ? CSSV.ok : st === 'edge' ? CSSV.reloc : st === 'out' ? CSSV.danger : CSSV.target;
    drawPin(p, String(i + 1), color, i === S.hoverTarget || i === S.hoverHit, i === S.hoverHit);
  });

  // ---- 「標目標」的游標指標：放下去會落在哪一格
  if (S.tool === 'target' && hc && S.hoverHit < 0) {
    const [x, y] = toScreen(hc[0] + 0.5, hc[1] + 0.5);
    if (sc >= 3) {                     // 放大時框出那一格
      applyIso(); ctx.beginPath(); ctx.rect(hc[0], hc[1], 1, 1); resetT();
      ctx.fillStyle = hexA(CSSV.target, 0.25); ctx.fill();
      ctx.strokeStyle = CSSV.target; ctx.lineWidth = 1.5; ctx.stroke();
    } else {                           // 縮小時畫十字準星
      ctx.strokeStyle = CSSV.target; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x - 7, y); ctx.moveTo(x + 7, y); ctx.lineTo(x + 10, y);
      ctx.moveTo(x, y - 10); ctx.lineTo(x, y - 7); ctx.moveTo(x, y + 7); ctx.lineTo(x, y + 10); ctx.stroke();
    }
    ctx.globalAlpha = 0.6;
    drawPin(hc, '+', CSSV.target, false, false);
    ctx.globalAlpha = 1;
  }
}

function circle(c, color, o) {
  applyIso(); ctx.beginPath(); ctx.arc(c[0] + 0.5, c[1] + 0.5, S.R, 0, Math.PI * 2); resetT();
  const a = o.alpha == null ? 1 : o.alpha;
  if (o.fill) { ctx.fillStyle = hexA(color, o.fill); ctx.fill(); }
  ctx.setLineDash(o.dash || []); ctx.lineWidth = o.width; ctx.strokeStyle = hexA(color, 0.9 * a); ctx.stroke();
  if (o.inner) {                       // 扣掉落點誤差後的保守射程
    applyIso(); ctx.beginPath(); ctx.arc(c[0] + 0.5, c[1] + 0.5, reach(), 0, Math.PI * 2); resetT();
    ctx.setLineDash([2, 4]); ctx.lineWidth = 1; ctx.strokeStyle = hexA(color, 0.55); ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawCity(c, color, label) {
  const [x, y] = toScreen(c[0] + 0.5, c[1] + 0.5);
  const s = Math.max(7, Math.min(15, S.view.scale * 2));
  ctx.beginPath();
  ctx.moveTo(x - s, y + s * 0.8); ctx.lineTo(x - s, y - s * 0.1); ctx.lineTo(x, y - s * 0.95);
  ctx.lineTo(x + s, y - s * 0.1); ctx.lineTo(x + s, y + s * 0.8); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = CSSV.panel; ctx.stroke();
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  haloText(label, x, y + s * 0.8 + 3, color.startsWith('rgba') ? CSSV.ink : color);
}

function drawPin(p, text, color, hot, removing) {
  const [x, y] = toScreen(p[0] + 0.5, p[1] + 0.5);
  const k = hot ? 1.25 : 1;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.bezierCurveTo(x - 9 * k, y - 12 * k, x - 11 * k, y - 22 * k, x, y - 26 * k);
  ctx.bezierCurveTo(x + 11 * k, y - 22 * k, x + 9 * k, y - 12 * k, x, y);
  ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = removing ? 3 : 2; ctx.strokeStyle = removing ? CSSV.danger : CSSV.panel; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `600 ${hot ? 12 : 11}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(removing ? '×' : text, x, y - 17 * k);
}

// ---------------------------------------------------------------- 滑鼠與觸控
// 游標底下是不是已經標過的目標（圖釘頭在座標點上方約 13 像素）
function hitTarget(lx, ly) {
  const [sx, sy] = toScreen(lx + 0.5, ly + 0.5);
  return S.targets.findIndex(p => {
    const [x, y] = toScreen(p[0] + 0.5, p[1] + 0.5);
    return (p[0] === lx && p[1] === ly) || Math.hypot(x - sx, y - 13 - sy) < 12;
  });
}

const pointers = new Map();
let drag = null, pinch = null;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2) {           // 兩指縮放
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), scale: S.view.scale };
    drag = null;
    return;
  }
  drag = { x: e.clientX, y: e.clientY, cx: S.view.cx, cy: S.view.cy, moved: false };
});
canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const mx = (a[0] + b[0]) / 2 - rect.left, my = (a[1] + b[1]) / 2 - rect.top;
    zoomAt(mx, my, (pinch.scale * d / pinch.d) / S.view.scale);
    return;
  }
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; canvas.classList.add('panning'); }
    if (drag.moved) {
      const [dlx, dly] = screenDeltaToLogic(dx, dy);
      S.view.cx = drag.cx - dlx; S.view.cy = drag.cy - dly;
      S.hover = null; hideTip(); draw();
      return;
    }
  }
  if (e.pointerType === 'touch') return;
  S.hover = toLogic(sx, sy);
  const hc = hoverCell();
  S.hoverHit = S.tool === 'target' ? hitTarget(hc[0], hc[1]) : -1;
  canvas.classList.toggle('remove', S.hoverHit >= 0);
  showTip(sx, sy);
  draw();
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size < 2) pinch = null; drag = null; return; }
  if (drag && !drag.moved && e.type === 'pointerup') {
    const rect = canvas.getBoundingClientRect();
    const [lx, ly] = toLogic(e.clientX - rect.left, e.clientY - rect.top);
    applyClick(Math.floor(lx), Math.floor(ly));
  }
  drag = null;
  canvas.classList.remove('panning');
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'touch') return;
  S.hover = null; S.hoverHit = -1; canvas.classList.remove('remove'); hideTip(); draw();
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, Math.exp(-e.deltaY * 0.0015));
}, { passive: false });

function applyClick(lx, ly) {
  if (S.tool === 'pan') return;
  if (S.tool === 'spot') { setSpot([lx, ly], false); return; }
  const hit = hitTarget(lx, ly);
  if (hit >= 0) { removeTarget(hit); return; }
  addTargets([[lx, ly]]);
}

function showTip(sx, sy) {
  const tip = $('tip');
  const [lx, ly] = hoverCell();
  const a = areaInfo([lx, ly]);
  const lines = [`<b>${lx}, ${ly}</b>`];
  if (S.tool === 'target')
    lines.push(S.hoverHit >= 0 ? `<span class="act rm">${esc(t('tipRemove', { i: S.hoverHit + 1 }))}</span>` : `<span class="act">${esc(t('tipAdd'))}</span>`);
  lines.push(a.cfg ? esc(`Lv${a.cfg[0]} ${t('res')[a.cfg[1]] || ''}`) : `<span class="m">${esc(t('emptyTip'))}</span>`);
  const lm = S.landmarks.find(l => Math.abs(l[0] - lx) <= 2 && Math.abs(l[1] - ly) <= 2);
  if (lm) lines.push(esc(lm[4] ? t('wharf') : (lm[5] ? t('born') : t('landmark', { lv: lm[3] || '?' }))));
  if (S.tool === 'spot') {
    lines.push(`<span class="m">${esc(a.land ? t('tipCanLand') : t('tipNoLand'))}</span>`);
    if (S.targets.length) {
      const n = S.targets.filter(p => status([lx, ly], p) === 'in').length;
      const e = S.targets.filter(p => status([lx, ly], p) === 'edge').length;
      lines.push(esc(t('tipHere', { n, e: e ? t('tipHereEdge', { e }) : '', t: S.targets.length })));
    }
  } else {
    if (S.spot) lines.push(`<span class="m">${esc(t(S.spotAuto ? 'tipDistSugg' : 'tipDistSpot', { d: gd(S.spot, [lx, ly]), r: S.R }))}</span>`);
    if (S.city) lines.push(`<span class="m">${esc(t('tipDistCity', { d: gd(S.city, [lx, ly]) }))}</span>`);
  }
  tip.innerHTML = lines.join('<br>');
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = sx + 26, y = sy + 18;
  if (x + tw > cw() - 8) x = sx - tw - 18;
  if (y + th > ch() - 8) y = sy - th - 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
  $('coord').textContent = `${lx}, ${ly}`;
}
function hideTip() { $('tip').style.display = 'none'; }

// ---------------------------------------------------------------- 控制項
function setTool(k) {
  S.tool = k;
  S.hoverHit = -1;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === k));
  $('toolhint').textContent = t(TOOL_HINT[k]);
  canvas.classList.toggle('grab', k === 'pan');
  canvas.classList.remove('remove');
  draw();
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const map = { '1': 'target', '2': 'spot', '3': 'pan' };
  if (map[e.key]) setTool(map[e.key]);
  if (e.key === '+' || e.key === '=') zoomAt(cw() / 2, ch() / 2, 1.4);
  if (e.key === '-') zoomAt(cw() / 2, ch() / 2, 1 / 1.4);
});
function submitTargets() {
  const items = parseMany($('t-in').value);
  const err = $('t-err');
  if (!items.length) { err.hidden = false; err.textContent = t('parseErr'); return; }
  err.hidden = true;
  $('t-in').value = '';
  addTargets(items);
  if (items.length === 1) centerOn(items[0][0] + 0.5, items[0][1] + 0.5, Math.max(S.view.scale, 2)); else fitView();
}
$('t-add').addEventListener('click', submitTargets);
$('t-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitTargets(); });
$('t-clear').addEventListener('click', () => { S.targets = []; S.spotAuto = true; changed(); });
$('t-fit').addEventListener('click', fitView);
$('city-in').addEventListener('change', (e) => {
  const v = e.target.value.trim() ? parseXY(e.target.value) : null;
  if (e.target.value.trim() && !v) { e.target.value = fmt(S.city); return; }
  S.city = v;
  changed();
});
$('city-clear').addEventListener('click', () => { S.city = null; changed(); });
$('spot-in').addEventListener('change', (e) => {
  const v = e.target.value.trim() ? parseXY(e.target.value) : null;
  if (e.target.value.trim() && !v) { renderSide(); return; }
  if (v) { setSpot(v, false); centerOnCircle(v); } else setSpot(null, true);
});
$('spot-clear').addEventListener('click', () => setSpot(null, true));
$('lang').addEventListener('change', (e) => {
  saveLang(e.target.value);
  applyLang(e.target.value);
});
$('zin').addEventListener('click', () => zoomAt(cw() / 2, ch() / 2, 1.5));
$('zout').addEventListener('click', () => zoomAt(cw() / 2, ch() / 2, 1 / 1.5));
$('zfit').addEventListener('click', fitView);
window.addEventListener('resize', resize);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readCssVars(); draw(); });
new MutationObserver(() => { readCssVars(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
$('lvscale').innerHTML = LV_COLORS.map((c, i) => `<div style="background:${c}">${i + 1}</div>`).join('');

// ---------------------------------------------------------------- 啟動
(function init() {
  readCssVars();
  const [lang, chosen] = pickLang();
  applyLang(lang);
  setTool('target');
  if (!chosen) askLang(lang);
  if (!MAPDATA) { $('nodata').hidden = false; return; }
  const d = MAPDATA;
  S.W = d.w; S.H = d.h; S.R = d.radius; S.slack = d.slack;
  S.grid = d.grid; S.landmarks = d.landmarks;
  const dec = (b64) => { const bin = atob(b64), out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
  S.res = dec(d.res); S.ok = dec(d.ok);
  restore();
  suggest();
  renderSide();
  resize();
  fitView();
})();
</script>
</body>
